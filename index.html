<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>SkiFree.js</title>
<style>
  html,body{margin:0;height:100vh;height:100dvh;background:#4a6a8a;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;overscroll-behavior:none}
  canvas{image-rendering:pixelated;background:#f4f8ff;touch-action:none}
  #wrap{position:relative;display:inline-block;line-height:0}
  #touchui{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:3%;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #touchui.show{display:flex}
  #touchui .grp{display:flex;gap:10px;pointer-events:none}
  .tbtn{pointer-events:auto;touch-action:none;width:15vmin;height:15vmin;min-width:48px;min-height:48px;max-width:64px;max-height:64px;border-radius:50%;background:rgba(10,16,28,.62);border:2px solid rgba(255,255,255,.9);color:#fff;font:bold 20px sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .tbtn:active{background:rgba(10,16,28,.85)}
  #turbobtn{background:rgba(170,20,20,.75)}
  #turbobtn:active{background:rgba(170,20,20,.95)}
</style>
</head>
<body>
<div id="wrap">
<canvas id="screen"></canvas>
<div id="touchui">
  <div class="grp">
    <div class="tbtn" id="leftbtn">&#9664;</div>
    <div class="tbtn" id="downbtn">&#9660;</div>
    <div class="tbtn" id="rightbtn">&#9654;</div>
  </div>
  <div class="grp">
    <div class="tbtn" id="turbobtn">F</div>
  </div>
</div>
</div>
<script>
"use strict";
// ---------- setup ----------
let BW=320, BH=240;   // recomputed responsively in fitScreen() to fill the window
// Deriving both BW and BH from one shared scale (below) already gives a tight natural fit on
// both axes for any window shape, so these exist only as a defensive backstop against absurd
// values (e.g. a sliver-sized devtools split) - NOT as design targets. Clamping either one
// without also adjusting the scale would make the canvas overflow or gap on that axis, which
// is exactly the bug this comment is here to warn future edits away from reintroducing.
const MIN_WORLD=80, MAX_WORLD=2000;
// Buffer pixels per world unit. Physics, collision and the camera all stay in world units, so
// raising this adds sprite detail without touching gameplay: the world still shows the same
// amount of terrain, each unit of it is just drawn on a U-times-finer grid. Sprite art is
// authored on that grid, so changing U means re-authoring every sprite - it is not a knob.
const U=2;
const cv=document.getElementById('screen');
const ctx=cv.getContext('2d');
const buf=document.createElement('canvas'); buf.width=BW; buf.height=BH;
const g=buf.getContext('2d');

// responsive: buf is always drawn to fill cv's actual pixel size, so we just
// resize cv (CSS size for layout, device-pixel size for a crisp nearest-neighbor scale).
// The device-pixel scale MUST be a whole number, or nearest-neighbor scaling maps
// source pixels to an uneven number of screen pixels and the image shimmers/blurs.
let PXS=1;   // device pixels per WORLD unit — used to place text (laid out in world coords) at native resolution
function fitScreen(){
  // must be the TRUE devicePixelRatio (uncapped): cv.width and cv.style.width both derive
  // from it, so backing-store pixels map exactly 1:1 to physical screen pixels. Capping this
  // would make the browser itself rescale the canvas by a non-integer factor to fill the CSS
  // box at the real dpr, reintroducing the exact blur this whole scheme exists to avoid.
  const dpr=window.devicePixelRatio||1;
  // Prefer the visualViewport over window.innerWidth/Height: on mobile browsers the latter can
  // include area hidden behind a collapsing address bar or on-screen keyboard, sizing the
  // canvas taller than what's actually visible and pushing content (like the title panel)
  // below the real fold even though the numbers "fit".
  const vw=window.visualViewport;
  const viewW=vw?vw.width:window.innerWidth, viewH=vw?vw.height:window.innerHeight;
  // Pick ONE integer scale s (device px per world px) up front, then derive BOTH BW and BH
  // from the window's actual device-pixel size divided by that same s. Deriving BW from a
  // continuous aspect-ratio ratio and *separately* flooring s (the previous approach) wastes
  // up to a whole scale-step of screen space whenever the ideal scale isn't a clean integer
  // (e.g. an ideal scale of 3.97 floors to 3, discarding ~25% of the window) - that's the big
  // blue margin. Rounding both dimensions against one fixed s bounds the leftover gap to at
  // most half a scale-step per axis: a couple of pixels, not a quarter of the screen.
  // s is device pixels per BUFFER pixel, and one world unit is U buffer pixels, so the zoom
  // level (device px per world unit) is quantised to multiples of U rather than to every
  // integer as it was before U existed. The visible world therefore lands near the 300-unit
  // target rather than always exactly on it - a coarser ladder is the price of the finer grid.
  const s=Math.max(1,Math.round(viewH*dpr/(300*U)));
  PXS=s*U;
  BW=Math.max(MIN_WORLD,Math.min(MAX_WORLD,Math.round(viewW*dpr/PXS)));
  BH=Math.max(MIN_WORLD,Math.min(MAX_WORLD,Math.round(viewH*dpr/PXS)));
  buf.width=BW*U; buf.height=BH*U;
  g.imageSmoothingEnabled=false;   // resizing a canvas resets its context state, so re-assert it
  cv.width=BW*PXS;
  cv.height=BH*PXS;
  cv.style.width=(BW*PXS/dpr)+'px';
  cv.style.height=(BH*PXS/dpr)+'px';
  ctx.imageSmoothingEnabled=false;
}
fitScreen();
addEventListener('resize',fitScreen);
addEventListener('orientationchange',fitScreen);
if(window.visualViewport){
  visualViewport.addEventListener('resize',fitScreen);
  visualViewport.addEventListener('scroll',fitScreen);
}

// ---------- tuning ----------
const MAXV=170, TURBOV=265, YETIV=196, GRAV=380;
const PX_PER_M=8, YETI_AT=1000, CELL=48;
const SPIN_RATE=7.5, FLIP_RATE=6.0;   // radians/sec while holding a trick direction in the air
// hunt mode: you are the yeti. It runs rather than slides, so its speed is simply commanded
// rather than fed by gravity, and its sprint has to beat a panicking skier or nothing is catchable.
const HUNT_SECS=60, HUNTV=180, HUNTSPRINT=252;
const PREYV=132, PREYPANIC=206, PREY_SEE=95, PREY_MAX=5;

// ---------- state ----------
let gamestate='title';           // title | play | over | paused
// held is keyed by ACTION, not by key name: everything downstream of the input layer asks "is the
// player steering left", never "is ArrowLeft down", which is what lets the controls screen rebind
// a key (or a touch button push the same action) without a single line of physics knowing.
let P, yeti, obstacles, cells, tracks, prints, particles, popups, live, style, nextYetiAt, held={};
let preys, eaten, timeLeft, nextPreyAt;
let timeNow=0;

// ---------- local high score (this device only, no server) ----------
let best={dist:0,style:0,eaten:0}, newBestDist=false, newBestStyle=false, newBestEaten=false;
try{
  const saved=JSON.parse(localStorage.getItem('skifree_best'));
  if(saved) best={dist:saved.dist||0,style:saved.style||0,eaten:saved.eaten||0};
}catch(e){}
function saveBest(){ try{ localStorage.setItem('skifree_best',JSON.stringify(best)); }catch(e){} }
function checkBest(meters,finalStyle){
  newBestDist=meters>best.dist;
  newBestStyle=finalStyle>best.style;
  if(newBestDist) best.dist=meters;
  if(newBestStyle) best.style=finalStyle;
  if(newBestDist||newBestStyle) saveBest();
  record(board.run,{d:meters,s:finalStyle,e:equip,t:Date.now()},'d');
}
function checkBestHunt(n){
  newBestEaten=n>best.eaten;
  if(newBestEaten){ best.eaten=n; saveBest(); }
  record(board.hunt,{n:n,t:Date.now()},'n');
}

// ---------- leaderboard ----------
// A table of runs rather than the single best of each stat above: the same device, the same
// browser, no server. best{} still drives the NEW BEST! flashes, so the two live side by side
// instead of one being rewritten in terms of the other.
const LB_MAX=5;
let board={run:[],hunt:[]};
let lbNew=null;                   // the row the last run earned, so the board can point it out
try{
  const saved=JSON.parse(localStorage.getItem('skifree_board'));
  if(saved){
    if(Array.isArray(saved.run))  board.run =saved.run.slice(0,LB_MAX);
    if(Array.isArray(saved.hunt)) board.hunt=saved.hunt.slice(0,LB_MAX);
  }
}catch(e){}
// Someone who set a best before this board existed still deserves their row: seed it from best{}
// once, dateless (t:0) because that run's date was never recorded.
if(!board.run.length && best.dist>0)   board.run.push({d:Math.floor(best.dist),s:Math.floor(best.style),e:'ski',t:0});
if(!board.hunt.length && best.eaten>0) board.hunt.push({n:best.eaten,t:0});
function saveBoard(){ try{ localStorage.setItem('skifree_board',JSON.stringify(board)); }catch(e){} }
function record(list,entry,key){
  list.push(entry);
  list.sort((a,b)=>b[key]-a[key]);
  if(list.length>LB_MAX) list.length=LB_MAX;
  // null if the run did not make the cut — and a blank run that only placed because the board is
  // still half empty is not worth congratulating either
  lbNew=(entry[key]>0&&list.indexOf(entry)>=0)?entry:null;
  saveBoard();
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function stamp(t){ if(!t) return ''; const d=new Date(t); return d.getDate()+' '+MONTHS[d.getMonth()]; }

// ---------- character choice ----------
// The first two are skins over one set of physics. The third swaps the game round: picking the
// yeti makes you the hunter, and the run becomes a timed count of how many skiers you can catch.
const CHARS=['ski','board','yeti'];
const CHAR_NAMES={ski:'SKIS',board:'SNOWBOARD',yeti:'YETI'};
const CHAR_BLURB={
  ski:  ['the classic rig: quick edges,','poles to plant, air off the ramps.'],
  board:['looser turns and floatier air,','with the same yeti on your tail.'],
  yeti: ['hunt mode - you are the monster.','eat every skier you can catch.'],
};
let equip='ski';
try{
  const savedEquip=localStorage.getItem('skifree_equip');
  if(CHARS.indexOf(savedEquip)>=0) equip=savedEquip;
}catch(e){}
function setChar(c){
  if(CHARS.indexOf(c)<0) return;
  equip=c;
  try{ localStorage.setItem('skifree_equip',equip); }catch(e){}
}
function cycleChar(step){ setChar(CHARS[(CHARS.indexOf(equip)+step+CHARS.length)%CHARS.length]); }
function hunting(){ return equip==='yeti'; }

// ---------- key bindings ----------
// The five things a player can actually do, and whichever key each is currently on. Remapped from
// the controls screen and persisted, so a WASD player never has to think about it again.
const ACTIONS=['left','right','down','up','turbo'];
const ACTION_NAMES={left:'Steer left',right:'Steer right',down:'Straight down',
                    up:'Flip back (air)',turbo:'Turbo / sprint'};
const PRESETS={
  arrows:{left:'arrowleft',right:'arrowright',down:'arrowdown',up:'arrowup',turbo:'f'},
  wasd:  {left:'a',right:'d',down:'s',up:'w',turbo:'shift'},
};
let binds=Object.assign({},PRESETS.arrows);
try{
  const saved=JSON.parse(localStorage.getItem('skifree_keys'));
  if(saved) for(const a of ACTIONS) if(typeof saved[a]==='string') binds[a]=saved[a];
}catch(e){}
function saveBinds(){ try{ localStorage.setItem('skifree_keys',JSON.stringify(binds)); }catch(e){} }
// Two actions sharing a key would leave one of them unreachable, so a clash swaps rather than
// duplicates: the key the rebound action is giving up goes to whoever owned the key it is taking.
function bindKey(action,k){
  const old=binds[action];
  for(const a of ACTIONS) if(a!==action && binds[a]===k) binds[a]=old;
  binds[action]=k;
  for(const a of ACTIONS) held[a]=false;   // a key rebound mid-press would otherwise never lift
  saveBinds();
}
function setPreset(name){
  for(const a of ACTIONS) binds[a]=PRESETS[name][a];
  for(const a of ACTIONS) held[a]=false;
  saveBinds();
}
function actionFor(k){ for(const a of ACTIONS) if(binds[a]===k) return a; return null; }
const KEY_LABELS={arrowleft:'←',arrowright:'→',arrowup:'↑',arrowdown:'↓',
                  ' ':'SPACE',shift:'SHIFT',control:'CTRL',alt:'ALT',tab:'TAB',enter:'ENTER'};
function keyLabel(k){ return KEY_LABELS[k]||(k.length===1?k.toUpperCase():k); }

function reset(){
  // t/eatT/step drive the yeti animation while hunting; the ski fields sit unused in that mode
  // (and vice versa) rather than being split into two shapes the shared helpers would have to
  // tell apart. state stays 'ski' for a yeti on its feet — it means "upright and moving".
  P={x:0,y:0,dir:0,speed:0,z:0,vz:0,state:'ski',crashT:0,invT:0,airT:0,spin:0,flip:0,
     spinsPaid:0,flipsPaid:0,landT:0,turbo:false,equip:equip,
     t:0,eatT:0,step:0,stunT:0};
  yeti={active:false,x:0,y:0,state:'chase',t:0,eatT:0,step:0};
  obstacles=[]; cells=new Set(); tracks=[]; prints=[]; particles=[]; popups=[]; live=null;
  preys=[]; eaten=0; timeLeft=HUNT_SECS; nextPreyAt=0;
  style=0; nextYetiAt=YETI_AT;
  newBestDist=false; newBestStyle=false; newBestEaten=false;
}
reset();

// ---------- sound ----------
let AC=null;
function initAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(freq,dur,type,vol,when){
  if(!AC)return;
  const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(), ga=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  ga.gain.setValueAtTime(vol||0.12,t);
  ga.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(ga); ga.connect(AC.destination);
  o.start(t); o.stop(t+dur);
}
const sndCrash =()=>{ beep(90,0.18,'square',0.15); beep(60,0.22,'sawtooth',0.12,0.05); };
const sndJump  =()=>{ beep(300,0.08,'square',0.08); beep(450,0.10,'square',0.08,0.06); };
const sndLand  =()=>{ beep(150,0.07,'square',0.08); };
const sndMunch =()=>{ for(let i=0;i<4;i++) beep(70+i*8,0.12,'sawtooth',0.16,i*0.28); };
const sndRoar  =()=>{ beep(55,0.6,'sawtooth',0.18); beep(48,0.6,'sawtooth',0.14,0.1); };
const sndTrick =()=>{ beep(500,0.08,'square',0.12); beep(700,0.09,'square',0.12,0.07); beep(950,0.11,'square',0.12,0.14); };
// menu feedback: a dry tick as the highlight moves, a two-note lift when something is chosen
const sndBlip  =()=>{ beep(620,0.03,'square',0.05); };
const sndPick  =()=>{ beep(720,0.05,'square',0.09); beep(980,0.07,'square',0.09,0.05); };

// ---------- music ----------
// A chiptune bed built from the same oscillators as the effects above, so the page stays one
// self-contained file with nothing to fetch. Notes are booked against the audio clock a quarter
// of a second ahead rather than fired from the animation frame: WebAudio only keeps musical time
// if a note is scheduled before it is due, and a dropped frame must never drop a beat.
const MUS={next:0, step:0, level:0, muted:false, noise:null, bus:null};
try{ MUS.muted=localStorage.getItem('skifree_mute')==='1'; }catch(e){}
function toggleMute(){
  MUS.muted=!MUS.muted;
  try{ localStorage.setItem('skifree_mute',MUS.muted?'1':'0'); }catch(e){}
}
function hz(n){ return 440*Math.pow(2,(n-69)/12); }   // MIDI note number to frequency
// Everything musical goes through one gain so the bed sits under the effects and can be balanced
// (or silenced) in a single place instead of note by note.
function musBus(){
  if(!MUS.bus){ MUS.bus=AC.createGain(); MUS.bus.gain.value=0.5; MUS.bus.connect(AC.destination); }
  return MUS.bus;
}
// i - VI - III - VII carries the cruise. The danger set swaps in Dm and a major E, and it is that
// E's G# - the harmonic-minor leading tone - that gives the chase its edge over the same key.
const PROG=[
  [{r:45,n:[69,72,76]},{r:41,n:[65,69,72]},{r:48,n:[72,76,79]},{r:43,n:[67,71,74]}],
  [{r:45,n:[69,72,76]},{r:41,n:[65,69,72]},{r:38,n:[62,65,69]},{r:40,n:[64,68,71]}],
];
const LEAD_CALM=[
  69,null,72,null,76,null,74,null,
  72,null,69,null,65,null,69,null,
  76,null,79,null,76,null,72,null,
  74,null,71,null,67,null,71,null,
];
// Same shape an octave up, but stuttered onto the off-beats and leaning on each chord's leading
// tone, so it reads as the calm theme panicking rather than as a different piece of music.
const LEAD_DANGER=[
  81,81,null,80,81,null,76,null,
  77,77,null,76,77,null,72,null,
  74,74,null,73,74,null,69,null,
  80,80,null,79,80,null,76,null,
];
const LEVELS=[
  {bpm:112, prog:0, lead:LEAD_CALM,   drums:0, arp:2, lvol:0.055, bvol:0.10},
  {bpm:132, prog:0, lead:LEAD_CALM,   drums:1, arp:1, lvol:0.060, bvol:0.12},
  {bpm:154, prog:1, lead:LEAD_DANGER, drums:2, arp:1, lvol:0.075, bvol:0.14},
];
function tone(freq,t,dur,type,vol){
  const o=AC.createOscillator(), ga=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  // an instant attack onto a bare exponential tail is most of what makes an oscillator read
  // as 8-bit; anything softer starts to sound like a synth pad instead
  ga.gain.setValueAtTime(0.0001,t);
  ga.gain.exponentialRampToValueAtTime(vol,t+0.006);
  ga.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(ga); ga.connect(musBus());
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBuffer(){
  if(!MUS.noise){
    const n=Math.floor(AC.sampleRate*0.4);
    MUS.noise=AC.createBuffer(1,n,AC.sampleRate);
    const d=MUS.noise.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }
  return MUS.noise;
}
function drumNoise(t,dur,freq,q,vol){    // band-passed noise: snare when low and wide, hat when high
  const s=AC.createBufferSource(); s.buffer=noiseBuffer();
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const ga=AC.createGain();
  ga.gain.setValueAtTime(vol,t);
  ga.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(ga); ga.connect(musBus());
  s.start(t); s.stop(t+dur+0.02);
}
function kick(t,vol){                    // a sine dropped fast down its own pitch
  const o=AC.createOscillator(), ga=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.11);
  ga.gain.setValueAtTime(vol,t);
  ga.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(ga); ga.connect(musBus());
  o.start(t); o.stop(t+0.18);
}
// Level 2 is the monster: it plays when the yeti is hunting you, and - when you are the yeti
// yourself - over the last ten seconds, which is the only stretch of a hunt that can still go
// badly. Menus and pauses fall back to the calm bed.
function wantedLevel(){
  if(gamestate!=='play') return 0;
  if(hunting()) return timeLeft<10?2:1;
  return yeti.active?2:0;
}
function scheduleStep(step,t){
  const L=LEVELS[MUS.level];
  const bar=(step>>3)&3, inBar=step&7;
  const ch=PROG[L.prog][bar];
  // bass: root on beats one and three, answered on the fifth. Danger drives straight eighths.
  if(inBar===0||inBar===4)                    tone(hz(ch.r),t,0.26,'triangle',L.bvol);
  else if(L.drums===2 && (inBar&1)===0)       tone(hz(ch.r+12),t,0.13,'triangle',L.bvol*0.6);
  else if(inBar===6)                          tone(hz(ch.r+7),t,0.20,'triangle',L.bvol*0.7);
  if(step%L.arp===0) tone(hz(ch.n[((step/L.arp)|0)%3]),t,0.10,'square',0.033);
  const m=L.lead[step&31];
  if(m!=null) tone(hz(m),t,0.15,'square',L.lvol);
  if(L.drums>0){
    if(inBar===0||inBar===4) kick(t,0.20);
    if(L.drums===2){
      if(inBar===2||inBar===6) drumNoise(t,0.13,1600,0.8,0.10);
      drumNoise(t,0.03,7000,1.2,0.030);
    }
  }
}
function musicTick(){
  if(!AC||AC.state!=='running'||MUS.muted){ MUS.next=0; return; }
  const now=AC.currentTime;
  // a backgrounded tab stops the animation frame while the audio clock runs on, so resync
  // rather than scheduling the whole silent stretch in one burst on the way back
  if(MUS.next<now) MUS.next=now+0.06;
  while(MUS.next<now+0.25){
    // level changes land on a half-bar, so a switch reads as a gear change rather than a glitch
    if((MUS.step&3)===0) MUS.level=wantedLevel();
    scheduleStep(MUS.step,MUS.next);
    MUS.next+=30/LEVELS[MUS.level].bpm;      // one eighth note
    MUS.step=(MUS.step+1)&31;
  }
}

// ---------- input ----------
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const a=actionFor(k);
  // while a row is waiting for its new key, nothing gets its default: Tab would move focus out of
  // the page and Space would scroll it, and either would happen instead of the bind
  if(a||rebindAction||['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','Escape'].includes(e.key)) e.preventDefault();
  initAudio();
  if(a) held[a]=true;
  // The controls screen swallows the whole next keystroke, so any key at all can be bound —
  // including the ones that mean something everywhere else.
  if(rebindAction){
    if(k!=='escape'&&k!=='enter') bindKey(rebindAction,k);
    rebindAction=null;
    return;
  }
  if(k==='escape'){
    if(gamestate==='play')        gamestate='paused';
    else if(gamestate==='paused') gamestate='play';
    else if(gamestate==='over')   toMenu();
    else if(menu!=='main')        menuActivate('back');
    return;
  }
  // M toggles music from anywhere, so quitting to the menu moved off it onto Q. Both step aside
  // if the player has bound that key to something of their own.
  if(k==='m'&&!a){ toggleMute(); return; }
  if(gamestate==='paused'){ if(k==='q'&&!a) toMenu(); return; }
  if(gamestate==='title'||gamestate==='over'){ menuKey(k,a); return; }
  if(P.state==='eaten') return;
  if(P.z>0) return;   // airborne: the steer keys drive spin/flip tricks instead (held, in update())
  if(a==='left')  P.dir=Math.max(P.dir-1,-2);
  if(a==='right') P.dir=Math.min(P.dir+1, 2);
  if(a==='down')  P.dir=0;
});
addEventListener('keyup',e=>{ const a=actionFor(e.key.toLowerCase()); if(a) held[a]=false; });

// ---------- touch controls ----------
const touchui=document.getElementById('touchui');
let touchMode=false;
// Only decides WHETHER this is a touch device; whether the pad is on screen is decided every
// frame in draw(), because the menus are tapped directly and the pad would only sit on top of them.
function checkTouch(){
  if(matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window || navigator.maxTouchPoints>0)
    touchMode=true;
}
checkTouch();
addEventListener('resize',checkTouch);
addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') checkTouch(); });
// Starting from the menu re-runs reset() so the run picks up whichever character is selected now
// (P caches equip, and hunt mode needs its clock back at the full minute). The cursor is handed
// back because the pointer is sitting on a button the instant the run starts.
function startRun(){ reset(); lbNew=null; cv.style.cursor='default'; gamestate='play'; }
function toMenu(){ reset(); gamestate='title'; menu='main'; menuSel=0; }
function stepLeft(){ if(gamestate==='play' && P.state!=='eaten' && P.z<=0) P.dir=Math.max(P.dir-1,-2); }
function stepRight(){ if(gamestate==='play' && P.state!=='eaten' && P.z<=0) P.dir=Math.min(P.dir+1,2); }
function stepDown(){ if(gamestate==='play' && P.state!=='eaten' && P.z<=0) P.dir=0; }
function bindHeld(el,action){         // mirrors a button into held{} so air tricks can read it like a keyboard hold
  const set=v=>e=>{ e.preventDefault(); held[action]=v; };
  el.addEventListener('pointerdown',set(true));
  el.addEventListener('pointerup',set(false));
  el.addEventListener('pointerleave',set(false));
  el.addEventListener('pointercancel',set(false));
}
function holdButton(el,fn){
  let iv=null,to=null;
  const start=e=>{ e.preventDefault(); initAudio(); fn();
    to=setTimeout(()=>{ iv=setInterval(fn,90); },350); };
  const stop=e=>{ if(e)e.preventDefault(); clearTimeout(to); clearInterval(iv); to=iv=null; };
  el.addEventListener('pointerdown',start);
  el.addEventListener('pointerup',stop);
  el.addEventListener('pointerleave',stop);
  el.addEventListener('pointercancel',stop);
}
holdButton(document.getElementById('leftbtn'),stepLeft);
holdButton(document.getElementById('rightbtn'),stepRight);
document.getElementById('downbtn').addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); stepDown(); });
bindHeld(document.getElementById('leftbtn'),'left');
bindHeld(document.getElementById('rightbtn'),'right');
bindHeld(document.getElementById('downbtn'),'down');
bindHeld(document.getElementById('turbobtn'),'turbo');
document.getElementById('turbobtn').addEventListener('pointerdown',initAudio);

// ---------- menu pointer ----------
// The canvas is one scaled image of a world-unit layout, so a click only has to be divided back
// down into world units to be tested against the same rects the menu drew itself with.
function evWorld(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*BW/r.width, y:(e.clientY-r.top)*BH/r.height};
}
function hitAt(p){
  for(let i=0;i<uiHits.length;i++){
    const b=uiHits[i];
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h) return i;
  }
  return -1;
}
function menuOpen(){ return gamestate==='title'||gamestate==='over'; }
cv.addEventListener('pointerdown',e=>{
  initAudio();
  if(!menuOpen()) return;
  const i=hitAt(evWorld(e));
  if(i<0) return;
  e.preventDefault();
  menuSel=i;                       // a tap moves the keyboard focus too, so the two never disagree
  menuActivate(uiHits[i].id);
});
// Hover is the mouse's version of the focus a keyboard moves with the arrow keys, so it drives the
// same variable rather than a second highlight of its own. Touch has no hover: the finger is the click.
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||!menuOpen()) return;
  const i=hitAt(evWorld(e));
  cv.style.cursor=i>=0?'pointer':'default';
  if(i>=0&&i!==menuSel){ menuSel=i; sndBlip(); }
});

// ---------- world spawning ----------
function hash2(x,y){ let h=(x*73856093)^(y*19349663); h=(h^(h>>>13))>>>0; return h; }
function spawnCell(cx,cy){
  const key=cx+','+cy;
  if(cells.has(key)) return;
  cells.add(key);
  const r=Math.random();
  if(r>0.52) return;
  const ox=cx*CELL+Math.random()*CELL, oy=cy*CELL+Math.random()*CELL;
  // keep a clear zone around the skier's current spot (matters at start)
  if(Math.hypot(ox-P.x,oy-P.y)<70) return;
  let type;
  const t=Math.random();
  if(t<0.42) type='tree';
  else if(t<0.52) type='deadtree';
  else if(t<0.68) type='rock';
  else if(t<0.80) type='stump';
  else type='ramp';
  // v picks between the art variants for that type, so a hillside of trees stops looking stamped
  obstacles.push({x:ox,y:oy,type,v:(Math.random()*4)|0});
}
function spawnAround(camX,camY){
  const x0=Math.floor((camX-120)/CELL), x1=Math.floor((camX+BW+120)/CELL);
  const y0=Math.floor((camY-60)/CELL),  y1=Math.floor((camY+BH+140)/CELL);
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++) spawnCell(cx,cy);
}

// ---------- helpers ----------
function puff(x,y,n,spread){
  for(let i=0;i<n;i++){
    particles.push({x:x+(Math.random()-0.5)*4, y:y+(Math.random()-0.5)*3,
      vx:(Math.random()-0.5)*(spread||60), vy:-Math.random()*40-10, life:0.4+Math.random()*0.3});
  }
}
// Floating score labels. Every award during a single jump merges into one "live" popup that
// rides along above the skier and counts up, instead of a pile of overlapping labels; it
// detaches and drifts away once you touch down. Crashes spawn a detached one straight away.
// An attached popup holds world coords and rides the skier. On release it converts to SCREEN
// coords and drifts there instead: the camera charges downhill at ski speed, so a popup left
// in the world gets swept off the top edge in a quarter of a second, well before it can fade.
function toScreen(p){ p.x-=P.x-BW/2; p.y-=P.y-70; }
// Highest screen row a label may occupy: stay clear of the HUD box (top-right, 32 tall) when the
// label is close enough to run under it. The threshold leaves room for the widest one, "+000 SPIN".
function popTopAt(sx){ return sx>BW-150?38:2; }
function popTop(p){ return popTopAt(p.x+12); }   // detached popups hold screen coords already
// Both a landing and a crash release their label at the skier, so crashing within a second of
// touching down would drop the red "-59" right on top of the green "+197". Stack instead.
function avoidOverlap(p){
  for(let n=0;n<6;n++){
    let clash=false;
    for(const q of popups){
      if(q!==p && !q.attached && Math.abs(q.y-p.y)<11 && Math.abs(q.x-p.x)<60){ clash=true; break; }
    }
    if(!clash) return;
    p.y+=12;
  }
}
function scorePopup(amount,label,color,x,y){
  const p={amount,label:label||'',color,x,y,life:1.2,pop:1,attached:false};
  toScreen(p);
  popups.push(p);
  if(popups.length>12) popups.shift();
  avoidOverlap(p);
  return p;
}
function liveScore(amount,label){
  if(!live){
    live={amount:0,label:'',color:'#1a8a3a',x:P.x,y:P.y-P.z,life:1.2,pop:0,attached:true};
    popups.push(live);
    if(popups.length>12) popups.shift();
  }
  live.amount+=amount;
  if(label){ live.label=label; live.pop=1; }   // only discrete awards bump; the drip must not
}
function releaseLive(){
  if(!live) return;
  toScreen(live);
  live.attached=false; live.life=1.2;
  avoidOverlap(live);
  live=null;
}
function crash(){
  // the faster you were showing off, the more the wipeout costs — but style never goes negative,
  // so the deduction is clamped to what you actually have and the label shows the clamped figure
  const cost=Math.min(Math.round(20+P.speed*0.15), Math.floor(style));
  if(cost>0){ style-=cost; scorePopup(-cost,'','#c22',P.x,P.y); }
  P.state='crash'; P.crashT=1.3; P.speed=0; P.z=0; P.vz=0;
  puff(P.x,P.y,12,90); sndCrash();
}

// ---------- update ----------
const ANGLES=[-1.30,-0.55,0,0.55,1.30];
// Shared by the animation and by the footprint/snow-spray emitter, so a print always lands on the
// frame the foot is actually down. The stride quickens as the yeti winds up, matching its speed
// ramp in the chase branch below. Takes the state so the hunted yeti and the played one share it.
function yetiRunPhase(st){ return st.t*(11+Math.min(1,st.t/15)*5); }
const HITBOX={tree:4,deadtree:3,rock:5,stump:3};
function hitsObstacle(x,y,o,pad){
  const hw=HITBOX[o.type];
  return hw!==undefined && Math.abs(x-o.x)<hw+(pad||0) && y-o.y>-2 && y-o.y<4;
}

// ---------- hunt mode ----------
// You are the yeti. It runs rather than slides: speed is commanded outright instead of being fed
// by gravity, and there is no skid-to-a-stop, so it holds full pace straight across the hill.
// That is what lets it cut off a skier who has broken sideways, which is the whole chase.
function updateHunter(dt){
  P.t+=dt;
  P.invT=Math.max(0,P.invT-dt);
  P.stunT=Math.max(0,P.stunT-dt);
  if(P.eatT>0){ P.eatT-=dt; P.speed=0; return; }     // held still over the meal
  const target=P.stunT>0?35:(held.turbo?HUNTSPRINT:HUNTV);
  P.speed+=(target-P.speed)*Math.min(1,3.2*dt);
  const a=ANGLES[P.dir+2];
  P.x+=Math.sin(a)*P.speed*dt; P.y+=Math.cos(a)*P.speed*dt;

  const half=Math.floor(yetiRunPhase(P)/Math.PI);
  if(half!==P.step && P.speed>40){
    P.step=half;
    const side=(half%2)?1:-1;
    prints.push({x:P.x+side*4,y:P.y,life:2.2});
    if(prints.length>60) prints.shift();
    puff(P.x+side*4,P.y,2,26);
  }
  // Trees stagger the yeti rather than wiping it out — it shoulders through and only loses its
  // stride. A full crash would turn the hunt into an avoidance game when it should be a pursuit.
  if(P.invT<=0){
    for(const o of obstacles){
      if(hitsObstacle(P.x,P.y,o,2)){
        P.stunT=0.45; P.invT=1.0; P.speed*=0.3;
        puff(P.x,P.y,7,70); sndCrash(); break;
      }
    }
  }
}
function spawnPrey(camY){
  preys.push({x:P.x+(Math.random()-0.5)*BW*0.95,
              y:camY+BH*0.55+Math.random()*(BH*0.5+40),
              dir:0, speed:PREYV, equip:Math.random()<0.5?'ski':'board',
              state:'ski', z:0, spin:0, flip:0, landT:0, crashT:0, turbo:false,
              wanderT:0, panic:0});
}
function updatePrey(dt,camY){
  if(preys.length<PREY_MAX && timeNow>nextPreyAt){ spawnPrey(camY); nextPreyAt=timeNow+0.45; }
  for(const s of preys){
    if(s.state==='crash'){
      s.crashT-=dt;
      if(s.crashT<=0){ s.state='ski'; s.speed=40; }
      continue;
    }
    s.landT=Math.max(0,s.landT-dt);
    const dx=s.x-P.x, dy=s.y-P.y;
    s.panic=Math.hypot(dx,dy)<PREY_SEE ? 1 : Math.max(0,s.panic-dt*0.7);
    if(s.panic>0){
      // break away from whichever side the yeti is on, hard enough to cut across the fall line
      s.dir=(dx>=0?1:-1)*(Math.abs(dx)<30?2:1);
      s.turbo=true;
    }else{
      s.turbo=false;
      s.wanderT-=dt;
      if(s.wanderT<=0){ s.wanderT=0.9+Math.random()*1.8; s.dir=[-1,0,0,0,1][(Math.random()*5)|0]; }
    }
    s.speed+=((s.turbo?PREYPANIC:PREYV)-s.speed)*Math.min(1,2.2*dt);
    const a=ANGLES[s.dir+2];
    s.x+=Math.sin(a)*s.speed*dt; s.y+=Math.cos(a)*s.speed*dt;
    // they clip trees too, and a skier who wipes out is your best shot at one that got a jump on you
    for(const o of obstacles){
      if(hitsObstacle(s.x,s.y,o)){ s.state='crash'; s.crashT=1.1; s.speed=0; puff(s.x,s.y,10,80); break; }
    }
  }
  if(P.eatT<=0 && P.stunT<=0){
    for(let i=0;i<preys.length;i++){
      const s=preys[i];
      if(Math.hypot(s.x-P.x,s.y-P.y) < (s.state==='crash'?14:11)){   // a sprawled skier is easier to grab
        preys.splice(i,1);
        eaten++; P.eatT=0.75; P.speed=0;
        scorePopup(1,'EATEN','#1a8a3a',P.x,P.y); sndMunch();
        break;
      }
    }
  }
  preys=preys.filter(s=>s.y>camY-70 && s.y<camY+BH+220 && Math.abs(s.x-P.x)<BW*1.1);
}

function update(dt){
  timeNow+=dt;
  if(gamestate!=='play') return;

  // --- player ---
  if(hunting()) updateHunter(dt);
  else if(P.state==='crash'){
    P.crashT-=dt;
    if(P.crashT<=0){ P.state='ski'; P.invT=1.0; P.speed=30; }
  }else if(P.state==='ski'){
    P.invT=Math.max(0,P.invT-dt);
    P.landT=Math.max(0,P.landT-dt);
    P.turbo=!!held.turbo;     // the tuck pose reads this off the state, like a prey skier's does
    const a=ANGLES[P.dir+2];
    if(P.z<=0){                        // steering/speed only change with your feet on the snow
      if(Math.abs(P.dir)===2){
        P.speed+=(0-P.speed)*Math.min(1,3.5*dt);          // skid to a stop
      }else{
        const target=held.turbo?TURBOV:MAXV;
        const rate=P.speed<target?0.55:2.5;
        P.speed+=(target-P.speed)*Math.min(1,rate*dt);
      }
    }
    const vx=Math.sin(a)*P.speed, vy=Math.cos(a)*P.speed;
    P.x+=vx*dt; P.y+=vy*dt;

    // air physics
    if(P.z>0){
      const drip=25*dt;
      P.airT+=dt; style+=drip; liveScore(drip);
      if(held.left)  P.spin-=SPIN_RATE*dt;
      if(held.right) P.spin+=SPIN_RATE*dt;
      if(held.up)    P.flip-=FLIP_RATE*dt;
      if(held.down)  P.flip+=FLIP_RATE*dt;
      // rotations pay out the moment they complete rather than all at once on landing, so the
      // popup (and the trick sound) react while you are still in the air and can see why
      const spins=Math.floor(Math.abs(P.spin)/(Math.PI*2));
      if(spins>P.spinsPaid){
        const n=spins-P.spinsPaid; P.spinsPaid=spins;
        style+=n*120; liveScore(n*120,'SPIN'); sndTrick();
      }
      const flips=Math.floor(Math.abs(P.flip)/(Math.PI*2));
      if(flips>P.flipsPaid){
        const n=flips-P.flipsPaid; P.flipsPaid=flips;
        style+=n*160; liveScore(n*160,'FLIP'); sndTrick();
      }
      P.vz-=GRAV*dt; P.z+=P.vz*dt;
      if(P.z<=0){
        P.z=0; P.vz=0;
        const air=Math.floor(P.airT*30);
        style+=air; liveScore(air,'AIR'); releaseLive();
        P.spin=0; P.flip=0; P.airT=0; P.spinsPaid=0; P.flipsPaid=0;
        P.landT=0.20;                              // squash-and-stretch on touchdown
        puff(P.x,P.y,5,50); sndLand();
      }
    }

    // tracks
    if(P.z<=0 && P.speed>10){
      tracks.push({x:P.x,y:P.y});
      if(tracks.length>200) tracks.shift();
    }
    // hard sideways skid: throw snow off the edges. The skid already scrubs your speed away
    // (see the |dir|===2 branch above) but until now it did so with nothing on screen to show it.
    if(P.z<=0 && Math.abs(P.dir)===2 && P.speed>25 && Math.random()<dt*30){
      particles.push({x:P.x-Math.sign(P.dir)*3, y:P.y-1,
        vx:-Math.sign(P.dir)*(40+Math.random()*60), vy:-20-Math.random()*30,
        life:0.3+Math.random()*0.25});
    }

    // collisions
    if(P.z<=0 && P.invT<=0){
      for(const o of obstacles){
        const dx=Math.abs(P.x-o.x), dy=P.y-o.y;
        if(o.type==='ramp'){
          if(dx<8 && dy>-3 && dy<3 && vy>40 && P.vz<=0){
            P.vz=85+P.speed*0.45; P.z=0.1; P.airT=0; P.spinsPaid=0; P.flipsPaid=0; sndJump();
          }
        }else if(hitsObstacle(P.x,P.y,o)){ crash(); break; }
      }
    }
  }

  const camX=P.x-BW/2, camY=P.y-70;
  spawnAround(camX,camY);
  obstacles=obstacles.filter(o=>o.y>camY-80 && Math.abs(o.x-P.x)<900);

  // --- hunt mode: prey, and the clock you are racing ---
  if(hunting()){
    updatePrey(dt,camY);
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; gamestate='over'; menuSel=0; checkBestHunt(eaten); }
  }

  // --- yeti (the one chasing you — it has no part in a run where you are it) ---
  const meters=Math.max(0,P.y/PX_PER_M);
  if(!hunting() && !yeti.active && meters>nextYetiAt){
    yeti.active=true; yeti.state='chase'; yeti.t=0;
    yeti.x=P.x+(Math.random()-0.5)*160; yeti.y=camY-24;
    sndRoar();
  }
  if(yeti.active){
    yeti.t+=dt;
    if(yeti.state==='chase'){
      const dx=P.x-yeti.x, dy=P.y-yeti.y, d=Math.hypot(dx,dy)||1;
      const v=YETIV+Math.min(30,yeti.t*2);            // slowly gets angrier
      yeti.x+=dx/d*v*dt; yeti.y+=dy/d*v*dt;
      // every half-cycle of the run animation is one foot landing: stamp a print and kick up snow
      const half=Math.floor(yetiRunPhase(yeti)/Math.PI);
      if(half!==yeti.step){
        yeti.step=half;
        const side=(half%2)?1:-1;
        prints.push({x:yeti.x+side*4,y:yeti.y,life:2.2});
        if(prints.length>60) prints.shift();
        puff(yeti.x+side*4,yeti.y,2,26);
      }
      if(d>380){ yeti.active=false; nextYetiAt=meters+YETI_AT; }  // you escaped
      else if(d<8 && P.state!=='eaten'){
        P.state='eaten'; yeti.state='eat'; yeti.eatT=0;
        yeti.x=P.x; yeti.y=P.y; sndMunch();
      }
    }else if(yeti.state==='eat'){
      yeti.eatT+=dt;
      if(yeti.eatT>2.4 && gamestate!=='over'){
        gamestate='over'; menuSel=0;
        checkBest(Math.floor(meters),Math.floor(style));
      }
    }
  }

  // --- particles ---
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);
  for(const f of prints) f.life-=dt;
  prints=prints.filter(f=>f.life>0);

  // --- score popups ---
  // safety net: cut the live tally loose if the run ends mid-flight (eaten by the yeti), since
  // the landing branch that normally releases it never runs in that case
  if(live && (P.state!=='ski' || P.z<=0)) releaseLive();
  for(const p of popups){
    if(p.attached){ p.x=P.x; p.y=P.y-P.z; }   // world coords: rides the skier through the jump
    else {                                    // screen coords: drifts up in place and fades
      p.y=Math.max(popTop(p)+14, p.y-20*dt);
      p.life-=dt;
    }
    p.pop=Math.max(0,p.pop-dt*5);             // the bump, decaying over ~0.2s
  }
  // re-resolve stacking after everyone has moved: two labels that both drift up into the HUD
  // clamp would otherwise pile onto the same pinned row and render on top of each other
  for(const p of popups) if(!p.attached) avoidOverlap(p);
  popups=popups.filter(p=>p.attached||p.life>0);
}

// ---------- sprite cache ----------
// Art lives on the U-times-finer buffer grid and is baked into offscreen canvases once at load,
// so a frame costs one drawImage per part instead of a dozen fillRects - the extra resolution is
// cheaper to draw than the vector shapes it replaces. Characters are jointed: torso, head and
// limbs are separate parts that the animation code positions every frame, which is what makes
// pose changes and run cycles cheap to add without re-authoring whole sprite sheets.
function pal(map){
  const o={};
  for(const k in map){
    const s=map[k];
    o[k]=[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16),
          s.length>7?parseInt(s.slice(7,9),16):255];
  }
  return o;
}
function rep(row,n){ return Array(n).fill(row); }
// (ax,ay) is the anchor: the pixel inside the art that lands on the position passed to blit().
function makeSprite(rows,palette,ax,ay){
  const w=rows[0].length, h=rows.length;
  for(let j=0;j<h;j++){                 // a miscounted row silently shears the whole sprite
    if(rows[j].length!==w) throw new Error('sprite row '+j+' is '+rows[j].length+' wide, expected '+w);
  }
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'), img=x.createImageData(w,h), d=img.data;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const col=palette[rows[j][i]];
    if(!col) continue;
    const o=(j*w+i)*4;
    d[o]=col[0]; d[o+1]=col[1]; d[o+2]=col[2]; d[o+3]=col[3];
  }
  x.putImageData(img,0,0);
  return {c,w,h,ax,ay};
}
// Scenery is all cones, slabs and stripes, which rect/triangle calls describe far more compactly
// than pixel rows would - but it is baked into the same kind of cached canvas.
function paintSprite(w,h,ax,ay,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  fn(x);
  return {c,w,h,ax,ay};
}
function ptri(p,cx,baseY,w,h){
  p.beginPath(); p.moveTo(cx-w/2,baseY); p.lineTo(cx+w/2,baseY); p.lineTo(cx,baseY-h); p.closePath(); p.fill();
}
function blit(sp,x,y){ g.drawImage(sp.c, Math.round(x)-sp.ax, Math.round(y)-sp.ay); }

// ---------- sprite art ----------
const SP={};

function kitFor(jacket,hat){
  const body=pal({o:jacket.o,k:jacket.k,j:jacket.j,J:jacket.J,z:jacket.z,p:'#26304a',M:'#2b2f42'});
  const back=pal({o:jacket.o,k:jacket.k,j:jacket.j,J:jacket.J,z:jacket.j,p:'#26304a',M:'#2b2f42'});
  const headPal=h=>pal({o:'#3a2418',k:hat.k,h:hat.h,H:hat.H,s:'#eab088',S:'#f7cfa8',d:'#c78a66',
                        g:'#2a2e3c',l:'#7ec8f0',L:'#ffffff',n:h});
  const head=headPal('#5a4030');
  return {torso:    makeSprite(TORSO_ROWS,body,7,16),
          torsoBack:makeSprite(TORSO_ROWS,back,7,16),
          torsoSide:makeSprite(TORSO_SIDE_ROWS,body,4,16),

          headSide: makeSprite(HEAD_SIDE_ROWS,head,5,16)};

// Each scenery type is a small family of variants rather than one stamp. The obstacle's v field
// (assigned at spawn) picks one, so a hillside no longer looks like the same tree photocopied.
SP.tree=[0,1,2].map(k=>paintSprite(28,38,14,36,p=>{
  const lean=[0,1,-1][k], tall=[0,2,-2][k];
  p.fillStyle='#3a2210'; p.fillRect(11,26,6,12);
  p.fillStyle='#6b3f1c'; p.fillRect(12,26,3,11);
  for(const [base,w,h] of [[38,28,15+tall],[29,21,13+tall],[21-tall,15,12]]){

// ---------- drawing ----------
// All of these take BUFFER pixel coordinates; the caller converts from world units.
// s is any skier-shaped thing — the player, or one of the skiers a yeti is hunting. Everything
// it needs comes off that object rather than off the globals, which is what lets the same rig
// draw a crowd of them.
function drawSkier(x,y,s){
  const board=s.equip==='board';
  const kit=board?KIT.board:KIT.ski;
  const yd=y-s.z*U;
  if(s.z>0){                                    // ground shadow, shrinking as you climb
    const k=Math.max(0.35,1-s.z/90), w=Math.round(20*k);
    g.fillStyle='rgba(120,140,160,.40)';
    g.fillRect(x-(w>>1),y-2,w,4);
  }
  if(s.state==='eaten') return;
  if(s.state==='crash'){ drawCrash(x,yd,kit,board,s); return; }
  const a=ANGLES[s.dir+2], air=s.z>0;
  const tuck=!air && s.turbo && s.speed>60;     // turbo: fold up small and go
  if(tuck) speedLines(x,y);
  g.save(); g.translate(x,yd); g.rotate(-a);

  // A spin (← →) is a real rotation about the vertical axis, so which of the three views you
  // see depends on the angle, and how wide it is drawn is that view's projected width. Front and
  // back are widest at |cos|, the profile at |sin|; picking whichever is larger switches views
  // exactly where the two projections are equal, so the width never jumps at the changeover.
  // A negative scale mirrors the art, which is what turning past half a revolution should do.
  const cs=Math.cos(s.spin), sn=Math.sin(s.spin);
  const side=Math.abs(sn)>Math.abs(cs);
  const torso=side?kit.torsoSide:(cs<0?kit.torsoBack:kit.torso);
  const head =side?kit.headSide :(cs<0?kit.headBack :kit.head);
  // flip (↑ ↓) is a front/back somersault seen edge-on, so a height squash is right for it.
  // The landing squash rides on top of the same two scales.
  const sq=s.landT/0.20;
  g.scale((side?sn:cs)*(1+sq*0.35), Math.cos(s.flip)*(1-sq*0.40));

  if(board){
    // snowboard: one wide board under both feet, pointed downhill like skis (the rider's
    // stance is sideways-on, but the board itself tracks the direction of travel), no poles
    blit(SP.board,0,0);
  }else{
    const splay=air?0.45:(tuck?0.05:0);
    g.save(); g.rotate(-splay); blit(SP.ski,-6,0); g.restore();
    g.save(); g.rotate( splay); blit(SP.ski, 6,0); g.restore();
  }
  // Everything above the hips leans into the turn and folds down in a tuck. Rotating about the
  // hip rather than the feet keeps the skis flat on the snow while the body angles over them.
  const lean=air?0:s.dir*0.13, drop=tuck?4:0;
  g.save(); g.translate(0,-4+drop); g.rotate(lean);
  blit(torso,0,0);
  // arms swing wide overhead in the air, tuck back along the body under turbo; each still grips
  // its pole, so the poles follow wherever the hands go
  const armA=air?2.0:(tuck?-0.55:0.20);
  // Seen in profile the shoulders are separated front-to-back, not left-to-right, so they very
  // nearly overlap. Leaving them a full body-width apart is what made the first pass read as a
  // front view that had merely been squeezed.
  const shoulder=side?2:7;
  for(const sgn of [-1,1]){
    g.save(); g.translate(sgn*shoulder,-11); g.rotate(-sgn*armA);
    blit(kit.arm,0,0);
    if(!board) blit(SP.pole,sgn*2,7);
    g.restore();
  }
  blit(head,0,-12);
  g.restore();
  g.restore();
}
// The wipeout runs as three beats over the 1.3s crash timer rather than one frozen pose: you
// tumble, you land in a heap, then you push yourself back upright as control returns.
function drawCrash(x,yd,kit,board,s){
  const el=1.3-s.crashT;
  const rot=el<0.30 ? el*4.5 : (el<0.85 ? 1.35 : Math.max(0.55,1.35-(el-0.85)*1.8));
  const fling=Math.min(1,el*3.5);
  if(board){
    g.save(); g.translate(x+fling*5,yd-8); g.rotate(0.6+fling*0.5); blit(SP.board,0,0); g.restore();
  }else{
    g.save(); g.translate(x-4-fling*7,yd-8); g.rotate(0.7+fling*0.8); blit(SP.ski,0,0); g.restore();
    g.save(); g.translate(x+4+fling*5,yd-6); g.rotate(-0.9-fling*0.5); blit(SP.ski,0,0); g.restore();
    g.save(); g.translate(x-fling*10,yd-2); g.rotate(1.5); blit(SP.pole,0,0); g.restore();
  }
  g.save(); g.translate(x,yd); g.rotate(rot);
  blit(kit.torso,0,-4);
  g.save(); g.translate(-7,-15); g.rotate(1.1); blit(kit.arm,0,0); g.restore();
  g.save(); g.translate( 7,-15); g.rotate(-2.0); blit(kit.arm,0,0); g.restore();
  blit(kit.head,0,-16);
  g.restore();
}
// P carries the played yeti's animation clocks; this adapts them to what drawYeti expects. eatT
// counts up into the meal while P.eatT counts the pause down, hence the subtraction.
function huntPose(){
  return {state:P.eatT>0?'eat':'chase', t:P.t, eatT:0.75-P.eatT};
}
// Backdraft streaks while turbo is held — the only cue for it used to be a word in the HUD.
function speedLines(x,y){
  g.fillStyle='rgba(150,175,200,.55)';
  for(let i=0;i<5;i++){
    const o=(i*37)%11;
    const ly=y-34-((timeNow*260+i*29)%46);
    g.fillRect(x-16+o*3+(i&1?22:0), Math.round(ly), 1, 7);
  }
}
// st is whichever yeti this is: the one hunting you, or the one you are playing. It needs
// state ('chase' | 'eat'), t (seconds since it started running) and eatT (seconds into a meal).
function drawYeti(x,y,st){
  const run=st.state==='chase', eat=st.state==='eat';
  // update() ramps the yeti's speed with its clock but nothing showed it; tie the visuals to the
  // same clock so a yeti that has been running for a while visibly winds up.
  const rage=Math.min(1,st.t/15);
  const ph=run?Math.sin(yetiRunPhase(st)):0;
  const bob=run?Math.round(Math.abs(ph)*2)-1:0;
  const lift=Math.round(ph*5);
  // It arrives already sprinting, so the entrance roar is a pose held over the first second of
  // the chase rather than a pause: standing still would just let the camera leave it behind.
  const roar=run && st.t<1.0;
  // stacked rects rather than one slab, so the shadow reads as a pool under the feet
  g.fillStyle='rgba(96,116,142,.22)';
  g.fillRect(x-10,y-3,20,5); g.fillRect(x-13,y-2,26,3);
  // legs: one lifts while the other plants, and each strides forward as it swings. The stride is
  // long and the arms swing wide and hang away from the body — a short stride under arms held
  // close is a waddle, which is what the first pass did.
  blit(SP.yetiLeg, x-8+Math.round(ph*3),  y-16-Math.max(0,lift));
  blit(SP.yetiLeg, x+8-Math.round(ph*3),  y-16-Math.max(0,-lift));
  blit(SP.yetiTorso, x, y-14+bob);
  // arms counter-swing against the legs, and reach out to grab during the meal. The shoulder
  // sits inside the torso outline, not level with its edge, so the join has no visible seam.
  for(const sgn of [-1,1]){
    g.save(); g.translate(x+sgn*12, y-40+bob);
    // eating: both arms raised inward, holding the meal up to the mouth. Roaring: thrown wide.
    g.rotate(eat ? sgn*2.6 : roar ? -sgn*2.3 : -sgn*(0.30+ph*sgn*0.55));
    blit(SP.yetiArm,0,0);
    g.restore();
  }
  // sunk into the shoulders rather than perched on top of them, so it runs hunched
  const hy=y-44+bob-(roar?2:0);                 // head thrown back mid-roar
  blit(rage>0.5?SP.yetiHeadRage:SP.yetiHead, x, hy);
  const my=hy-6;   // lines up with the muzzle band baked into the head art
  if(eat||roar){
    // eating chomps on a timer; the roar holds its jaw wide and shudders
    const gape=eat?(Math.floor(st.eatT*6)%2)*3:3+Math.round(Math.sin(st.t*30));
    const h=6+gape;
    g.fillStyle='#101018'; g.fillRect(x-7,my,14,h);          // the maw
    g.fillStyle='#a02020'; g.fillRect(x-5,my+3,10,h-5);      // throat
    g.fillStyle='#ffffff';                                   // and two rows of them, interlocking
    fang(x-6,my,3,true);   fang(x-3,my,4,true);   fang(x+1,my,4,true);   fang(x+4,my,3,true);
    fang(x-6,my+h-3,3,false); fang(x-2,my+h-4,4,false);
    fang(x+2,my+h-4,4,false); fang(x+5,my+h-3,3,false);
  }else{
    // Not a shut mouth but a held snarl: the jaw hangs open on its teeth even at rest. A closed
    // line for a mouth is most of what made this thing look pleased with itself.
    g.fillStyle='#101018'; g.fillRect(x-6,my+1,12,5);
    g.fillStyle='#7a1c1c'; g.fillRect(x-4,my+3,8,2);
    g.fillStyle='#ffffff';
    fang(x-5,my+1,3,true);  fang(x-1,my+1,3,true);  fang(x+3,my+1,3,true);
    fang(x-4,my+4,2,false); fang(x+2,my+4,2,false);
  }
}
// One tooth: two pixels of gum tapering to a single-pixel point, hanging down from the upper jaw
// or standing up from the lower one.
function fang(fx,fy,h,down){
  g.fillRect(fx, down?fy:fy+1, 2, h-1);
  g.fillRect(fx, down?fy+h-1:fy, 1, 1);
}

function draw(){
  const W=BW*U, H=BH*U;
  g.fillStyle='#f4f8ff'; g.fillRect(0,0,W,H);
  const camX=Math.round(P.x-BW/2), camY=Math.round(P.y-70);   // world units: culling and spawning
  const bx=camX*U, by=camY*U;                                 // the same camera, in buffer pixels

  // snow speckle — one buffer pixel each, so the grain got finer with the resolution
  g.fillStyle='#dde6ee';
  const cx0=Math.floor(camX/CELL), cx1=Math.floor((camX+BW)/CELL);
  const cy0=Math.floor(camY/CELL), cy1=Math.floor((camY+BH)/CELL);
  for(let cy=cy0;cy<=cy1;cy++) for(let cx=cx0;cx<=cx1;cx++){
    let h=hash2(cx,cy);
    for(let i=0;i<6;i++){
      h=(h*1103515245+12345)>>>0;
      const px=cx*CELL*U+(h%(CELL*U)); h=(h*1103515245+12345)>>>0;
      const py=cy*CELL*U+(h%(CELL*U));
      g.fillRect(px-bx,py-by,1,1);
    }
  }

  // ski tracks
  g.fillStyle='#c4d2e0';
  for(const t of tracks){
    const tx=Math.round(t.x*U)-bx, ty=Math.round(t.y*U)-by;
    if(tx<-8||tx>W+8||ty<-8||ty>H+8) continue;
    g.fillRect(tx-5,ty,2,3); g.fillRect(tx+3,ty,2,3);
  }
  // yeti footprints, pressed deeper than a ski track and filling back in as they age
  for(const f of prints){
    const fx=Math.round(f.x*U)-bx, fy=Math.round(f.y*U)-by;
    if(fx<-10||fx>W+10||fy<-10||fy>H+10) continue;
    g.fillStyle=f.life>1.1?'#a8b8cc':'#c6d4e2';
    g.fillRect(fx-4,fy-2,8,5); g.fillRect(fx-3,fy-4,6,2);
  }

  // depth-sorted entities
  const items=[];
  for(const o of obstacles){
    if(o.x-camX<-20||o.x-camX>BW+20||o.y-camY<-10||o.y-camY>BH+30) continue;
    items.push(o);
  }
  items.push({x:P.x,y:P.y,type:'player'});
  for(const s of preys){
    if(s.x-camX<-30||s.x-camX>BW+30||s.y-camY<-20||s.y-camY>BH+40) continue;
    items.push({x:s.x,y:s.y,type:'prey',s});
  }
  if(yeti.active) items.push({x:yeti.x,y:yeti.y,type:'yeti'});
  items.sort((a,b)=>a.y-b.y);
  for(const it of items){
    const x=Math.round(it.x*U)-bx, y=Math.round(it.y*U)-by;
    const set=SP[it.type];
    switch(it.type){
      case 'tree': case 'deadtree': case 'rock': case 'stump':
                       blit(set[it.v%set.length],x,y); break;
      case 'ramp':     blit(SP.ramp,x,y); break;
      case 'prey':     drawSkier(x,y,it.s); break;
      case 'player':   if(hunting()) drawYeti(x,y,huntPose()); else drawSkier(x,y,P); break;
      case 'yeti':     drawYeti(x,y,yeti); break;
    }
  }

  // particles — thinning out as they fade, which the old fixed 2x2 dot could not do
  for(const p of particles){
    const k=Math.min(1,p.life*2.2), s=1+Math.round(k*2);
    g.fillStyle=k>0.55?'#ffffff':'#e2ecf6';
    g.fillRect(Math.round(p.x*U)-bx,Math.round(p.y*U)-by,s,s);
  }

  // HUD box background (text is drawn later, at full device resolution, for crisp anti-aliasing
  // instead of blurry nearest-neighbor-scaled glyphs)
  // (boxes are still laid out in world units, then scaled up to the buffer grid, so the numbers
  // stay comparable with the world-unit text coordinates that get drawn over them below)
  const meters=Math.floor(Math.max(0,P.y/PX_PER_M));
  const showHud=gamestate!=='title';        // the menu is the whole screen: no run to report on yet
  if(showHud) box(BW-96,3,93,32,'rgba(255,255,255,.92)');

  // desktop control hint box background (touch users have on-screen buttons instead)
  const showHint=!touchMode && gamestate!=='title';
  if(showHint) box(3,BH-42,132,39,'rgba(255,255,255,.82)');
  // the d-pad is for skiing; menus are tapped directly, and it would only cover them up
  touchui.classList.toggle('show', touchMode && (gamestate==='play'||gamestate==='paused'));

  let pauseY=0;
  if(menuOpen())                drawMenu();          // panels/boxes now, their labels queued for below
  else if(gamestate==='paused') pauseY=panel(196,94);

  ctx.drawImage(buf,0,0,cv.width,cv.height);

  // ---- floating score popups: world-anchored, but on the crisp text layer like the HUD.
  // Sits to the SIDE of the skier rather than above: the camera holds you only 70px from the
  // top of the screen, so at the apex of a jump a label overhead would clip off the edge.
  // Clamped into the viewport anyway, for the tail of a big air where even that is not enough.
  // Hidden behind a menu panel, where they would just clutter the game-over/pause box.
  if(gamestate==='play'){
    for(const p of popups){
      const n=Math.abs(Math.floor(p.amount));
      const sx=(p.attached?p.x-camX:p.x)+12;
      ctext((p.amount<0?'-':'+')+n+(p.label?' '+p.label:''),
        sx, Math.max(popTopAt(sx), (p.attached?p.y-camY:p.y)-14), 8*(1+0.5*p.pop),
        {bold:true, color:p.color, alpha:p.attached?1:Math.min(1,p.life/0.5)});
    }
  }

  // ---- text, drawn straight onto the full-resolution canvas for crisp anti-aliasing ----
  if(showHud){
    if(hunting()){
      ctext('time  '+timeLeft.toFixed(1)+'s', BW-90,6,8,{color:timeLeft<10?'#c22':'#112',bold:timeLeft<10});
      ctext('eaten '+eaten, BW-90,15,8);
      ctext('speed '+Math.round(P.speed/PX_PER_M)+' m/s', BW-90,24,8);
      if(held.turbo&&gamestate==='play') ctext('SPRINT!', BW-90,36,8,{color:'#c22'});
    }else{
      ctext('dist  '+meters+' m', BW-90,6,8);
      ctext('speed '+Math.round(P.speed/PX_PER_M)+' m/s', BW-90,15,8);
      ctext('style '+Math.floor(style), BW-90,24,8);
      if(held.turbo&&gamestate==='play'&&P.state==='ski'){
        ctext('TURBO!', BW-90,36,8,{color:'#c22'});
      }
    }
  }
  if(showHint){
    const L=keyLabel(binds.left), R=keyLabel(binds.right), D=keyLabel(binds.down);
    const Up=keyLabel(binds.up), F=keyLabel(binds.turbo);
    if(hunting()){
      ctext(L+' '+R+' steer   '+D+' straight on',6,BH-39,7);
      ctext('hold '+F+' to sprint',6,BH-30,7);
      ctext('run them down and eat them',6,BH-21,7);
    }else{
      ctext(L+' '+R+' steer   '+D+' down',6,BH-39,7);
      ctext('hold '+F+' for turbo',6,BH-30,7);
      ctext('in air: '+L+' '+R+' spin  '+Up+' '+D+' flip',6,BH-21,7);
    }
    ctext('Esc: pause    M: music '+(MUS.muted?'off':'on'),6,BH-12,7);
  }
  if(menuOpen())                drawMenuLabels();
  else if(gamestate==='paused') drawPausedText(pauseY);
}
// menus/HUD text were laid out assuming a ~320-wide world; on a narrow phone BW can be far
// smaller than that (the world now shrinks to whatever width fills the screen at a normal
// zoom level, see fitScreen()), so shrink UI text proportionally below that reference width
// instead of letting it run past the edges of a narrower screen. No effect once BW>=320
// (true on every desktop/landscape window verified so far).
function uiScale(){ return Math.min(1,BW/320); }
function ctext(str,x,y,size,opts){
  opts=opts||{};
  const oldAlpha=ctx.globalAlpha;
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillStyle=opts.color||'#112';
  ctx.font=(opts.bold?'bold ':'')+Math.max(1,Math.round(size*PXS*uiScale()))+'px monospace';
  ctx.textAlign=opts.align||'left';
  ctx.textBaseline='top';
  ctx.fillText(str, Math.round(x*PXS), Math.round(y*PXS));
  ctx.globalAlpha=oldAlpha;
}
// A filled, hairline-outlined box given in WORLD units. The border stays one buffer pixel wide
// rather than scaling with U, so it reads as a crisp hairline instead of a chunky bar.
function box(x,y,w,h,fill){
  g.fillStyle=fill; g.fillRect(x*U,y*U,w*U,h*U);
  g.strokeStyle='#334'; g.lineWidth=1;
  g.strokeRect(x*U+0.5,y*U+0.5,w*U-1,h*U-1);
}
function panel(w,h){
  w=Math.min(w,BW-12); h=Math.min(h,BH-12);   // never wider/taller than the visible world
  const x=(BW-w)/2, y=(BH-h)/2;
  box(x,y,w,h,'rgba(244,248,255,.96)');
  g.strokeRect(x*U+2.5,y*U+2.5,w*U-5,h*U-5);
  return y;
}
// Spacing between the three menu portraits, and the row they stand on. Shared so the highlight,
// the icons and the name underneath cannot drift apart.
function iconGap(){ return Math.min(62,BW*0.26); }

// ---------- menu ----------
// Every screen is built the same way: boxes and sprites go down on the pixel buffer during the
// normal draw pass, their labels are queued and stamped onto the full-resolution canvas afterwards
// (the same split the HUD uses to keep text crisp), and every clickable thing is pushed onto
// uiHits in keyboard-focus order. One list drives hit-testing, hover and arrow-key focus, so those
// three can never disagree about where a button is or which one is highlighted.
//
// Layout is in world units scaled by uiScale(), which is BW/320 — the panel therefore keeps the
// same proportions on a phone as on a desktop, and since ctext() applies that same factor to type,
// the text inside it stays the same size relative to its box at every screen width.
let menu='main';           // main | chars | scores | controls
let menuSel=0;             // index into uiHits: the focused (or hovered) widget
let rebindAction=null;     // controls screen: the action waiting to be told its new key
let uiHits=[], menuTexts=[];
const LOGO='SKIBIDIFREE';
const BACK_TO={chars:1,scores:2,controls:3};   // returning from a screen re-focuses the row that opened it
// Row heights, the one place the layout is not purely proportional: a finger needs a bigger target
// than a mouse pointer, so touch devices get taller rows and everyone else keeps the tight ones.
function btnH(S,base){ return Math.round(base*(touchMode?1.35:1)*S); }
function mtext(str,x,y,size,opts){ menuTexts.push({str:str,x:x,y:y,size:size,opts:opts||{}}); }
function mlogo(x,y,maxW,size){ menuTexts.push({logo:true,x:x,y:y,maxW:maxW,size:size}); }
// A panel can never be taller than the world is: in a freakishly short window (a browser dragged
// down to a strip) the screens clamp to this BEFORE laying anything out, so a widget positioned
// off the panel's bottom edge — the BACK button — still lands inside the box that gets drawn.
function fitH(h){ return Math.min(h,BH-8); }
function mpanel(x,w,h){
  h=fitH(h);
  const y=Math.round((BH-h)/2);
  box(x,y,w,h,'rgba(244,248,255,.96)');
  g.strokeRect(x*U+2.5,y*U+2.5,w*U-5,h*U-5);
  return y;
}
// One widget. The box lands on the pixel layer immediately; the label is queued. A focused widget
// is filled rather than merely outlined, because an outline is one buffer pixel wide and vanishes
// on a phone. value is the right-hand column: what the row is currently set to.
function mbtn(x,y,w,h,id,label,value,opts){
  opts=opts||{};
  const sel=uiHits.length===menuSel;
  uiHits.push({x:x,y:y,w:w,h:h,id:id});
  box(x,y,w,h,sel?'rgba(74,132,201,.95)':'rgba(255,255,255,.82)');
  const S=uiScale(), ts=opts.size||8, ty=y+(h-ts*S)/2;
  const fg=sel?'#ffffff':'#12243c';
  if(opts.center){ mtext(label,x+w/2,ty,ts,{align:'center',bold:true,color:fg}); return; }
  mtext(label,x+6*S,ty,ts,{color:fg});
  if(value!=null) mtext(value,x+w-6*S,ty,ts,{align:'right',bold:true,color:sel?'#e6f1ff':'#2f6ba8'});
}
// A little stepped conifer. Drawn as rectangles rather than blitted from SP.tree because the
// obstacle sprites are authored at one fixed size and this one has to scale with the panel.
function pine(cx,base,h){
  const rows=5, rh=h/rows;
  for(let i=0;i<rows;i++){
    const wi=h*(0.20+0.60*(i+1)/rows), top=base-h+i*rh;
    const px=Math.round((cx-wi/2)*U), py=Math.round(top*U);
    const pw=Math.max(1,Math.round(wi*U)), ph=Math.max(1,Math.round((rh+0.6)*U));
    g.fillStyle='#1c6b2a'; g.fillRect(px,py,pw,ph);
    g.fillStyle='#2f9440'; g.fillRect(px,py,Math.max(1,Math.round(pw*0.42)),ph);
  }
}
// The wordmark: an extruded slab with a hard navy edge and an ice gradient down the face. Drawn on
// the text layer like the rest of the type, so it stays sharp at any zoom, and auto-shrunk to the
// width it is given rather than trusting a hard-coded size to fit every window.
function drawLogo(cx,y,maxW,size){
  let px=Math.max(6,Math.round(size*PXS*uiScale()));
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font='bold '+px+'px monospace';
  const wide=ctx.measureText(LOGO).width;
  if(wide>maxW*PXS){ px=Math.max(6,Math.floor(px*maxW*PXS/wide)); ctx.font='bold '+px+'px monospace'; }
  const X=Math.round(cx*PXS), Y=Math.round(y*PXS), d=Math.max(2,Math.round(px*0.11));
  ctx.lineJoin='round';
  ctx.fillStyle='#24406b';
  for(let i=d;i>0;i--) ctx.fillText(LOGO,X+i*0.45,Y+i);   // the extrusion, back to front
  ctx.strokeStyle='#101f38'; ctx.lineWidth=Math.max(2,px*0.13);
  ctx.strokeText(LOGO,X,Y);
  const gr=ctx.createLinearGradient(0,Y,0,Y+px);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.48,'#cfe8ff');
  gr.addColorStop(0.52,'#7fb6ec'); gr.addColorStop(1,'#3d7fd0');
  ctx.fillStyle=gr; ctx.fillText(LOGO,X,Y);
  ctx.restore();
}
function bestLabel(){
  if(hunting()) return best.eaten>0?best.eaten+' eaten':'—';
  return best.dist>0?Math.floor(best.dist)+' m':'—';
}
function bindStyle(){                 // name the current mapping if it is one of the presets
  for(const n in PRESETS){
    let same=true;
    for(const a of ACTIONS) if(binds[a]!==PRESETS[n][a]) same=false;
    if(same) return n==='wasd'?'WASD':'ARROWS';
  }
  return 'CUSTOM';
}
function drawMenu(){
  uiHits=[]; menuTexts=[];
  const S=uiScale();
  const w=Math.min(Math.round(304*S),BW-8), x=Math.round((BW-w)/2);
  if(gamestate==='over')        overScreen(x,w,S);
  else if(menu==='chars')       charScreen(x,w,S);
  else if(menu==='scores')      scoreScreen(x,w,S);
  else if(menu==='controls')    controlScreen(x,w,S);
  else                          mainScreen(x,w,S);
  if(menuSel>=uiHits.length) menuSel=Math.max(0,uiHits.length-1);
}
function drawMenuLabels(){
  for(const t of menuTexts){
    if(t.logo) drawLogo(t.x,t.y,t.maxW,t.size);
    else ctext(t.str,t.x,t.y,t.size,t.opts);
  }
}
function mainScreen(x,w,S){
  const bh=btnH(S,19), gp=Math.round(4*S), pad=Math.round(12*S), head=Math.round(51*S);
  const h=head+5*bh+4*gp+pad;
  const y=mpanel(x,w,h);
  // wordmark, the shelf of snow it stands on, and a pine at each end of that shelf
  mlogo(BW/2,y+Math.round(7*S),w-Math.round(20*S),22);
  const shelf=y+Math.round(36*S), inset=Math.round(15*S), th=Math.max(1,Math.round(1.5*S));
  g.fillStyle='#e8f2fd'; g.fillRect((x+inset)*U,shelf*U,(w-2*inset)*U,th*U);
  g.fillStyle='#a8c6e6'; g.fillRect((x+inset)*U,(shelf+th)*U,(w-2*inset)*U,Math.max(1,Math.round(S))*U);
  pine(x+inset+Math.round(9*S),shelf+th,Math.round(15*S));
  pine(x+w-inset-Math.round(9*S),shelf+th,Math.round(15*S));
  mtext('endless downhill  ·  mind the yeti',BW/2,y+Math.round(40*S),7,{align:'center',color:'#5b83ae'});
  const bx=x+Math.round(20*S), bw=w-Math.round(40*S), step=bh+gp;
  let by=y+head;
  mbtn(bx,by,bw,bh,'play','▶  PLAY',null,{center:true,size:9});               by+=step;
  mbtn(bx,by,bw,bh,'chars','CHARACTER',CHAR_NAMES[equip]);                    by+=step;
  mbtn(bx,by,bw,bh,'scores','LEADERBOARD',bestLabel());                       by+=step;
  mbtn(bx,by,bw,bh,'controls','CONTROLS',bindStyle());                        by+=step;
  mbtn(bx,by,bw,bh,'music','MUSIC',MUS.muted?'OFF':'ON');
  mtext('↑ ↓ move    ENTER select    or click',BW/2,by+bh+Math.round(3*S),6,
    {align:'center',color:'#7a97b8'});
}
// The portraits draw themselves through the same functions the game uses, so one can never fall
// out of step with how that character actually looks on the hill. They are pixel art at a fixed
// size, so unlike everything else here their cell is in plain world units rather than scaled ones.
function charScreen(x,w,S){
  const bh=btnH(S,19), pad=Math.round(12*S), ICON=50;
  const head=Math.round(23*S), foot=Math.round(40*S);
  const y=mpanel(x,w,head+ICON+foot+bh+pad);
  mtext('SELECT CHARACTER',BW/2,y+Math.round(7*S),10,{align:'center',bold:true});
  const row=y+head, gap=iconGap();
  CHARS.forEach((c,i)=>{
    const cx=BW/2+(i-1)*gap, cw=gap*0.78, sel=uiHits.length===menuSel;
    uiHits.push({x:cx-cw/2,y:row,w:cw,h:ICON,id:'char:'+c});
    if(c===equip)     box(cx-cw/2,row,cw,ICON,sel?'rgba(74,132,201,.80)':'rgba(150,190,235,.55)');
    else if(sel)      box(cx-cw/2,row,cw,ICON,'rgba(214,232,250,.85)');
    // The two rigs hang off their origins differently — skis run on past the boots, a yeti stands
    // on its feet — so each gets the ground line that centres it in the same cell.
    const gy=Math.round((row+ICON*(c==='yeti'?0.94:0.68))*U), sx=Math.round(cx*U);
    if(c==='yeti'){
      // cycled rather than free-running, so the portrait roars every few seconds instead of once
      drawYeti(sx,gy,{state:'chase',t:0.25+(timeNow%4.5),eatT:0});
    }else{
      drawSkier(sx,gy,{equip:c,state:'ski',dir:0,speed:120,z:0,spin:0,flip:0,
                       landT:0,crashT:0,turbo:false});
    }
  });
  // Whichever portrait the focus is on describes itself; with the focus on BACK, the one you are
  // actually equipped with does.
  const shown=menuSel<CHARS.length?CHARS[menuSel]:equip;
  const ty=row+ICON+Math.round(4*S);
  mtext(CHAR_NAMES[shown]+(shown===equip?'   ·   selected':''),BW/2,ty,9,{align:'center',bold:true});
  mtext(CHAR_BLURB[shown][0],BW/2,ty+Math.round(13*S),7,{align:'center',color:'#456'});
  mtext(CHAR_BLURB[shown][1],BW/2,ty+Math.round(22*S),7,{align:'center',color:'#456'});
  mbtn(x+Math.round(20*S),row+ICON+foot,w-Math.round(40*S),bh,'back','BACK',null,{center:true});
}
function lbSection(lx,rx,ty,S,lh,title,list,fmt){
  mtext(title,lx,ty,8,{bold:true,color:'#1a5f9e'});
  ty+=Math.round(12*S);
  for(let i=0;i<LB_MAX;i++){
    const e=list[i], fresh=!!e&&e===lbNew;   // the row the run you just finished earned
    if(e){
      const cols=fmt(e);
      mtext((i+1)+'.  '+cols[0],lx,ty,7,{color:fresh?'#1a8a3a':'#112',bold:fresh});
      if(cols[1]) mtext(cols[1],rx,ty,7,{align:'right',color:fresh?'#1a8a3a':'#5b83ae'});
    }else{
      mtext((i+1)+'.  —',lx,ty,7,{color:'#9fb2c6'});
    }
    ty+=lh;
  }
  return ty;
}
function scoreScreen(x,w,S){
  const bh=btnH(S,19), pad=Math.round(12*S), lh=Math.round(9*S);
  const head=Math.round(23*S), sec=Math.round(12*S)+LB_MAX*lh, gapS=Math.round(9*S);
  const h=fitH(head+2*sec+gapS+Math.round(6*S)+bh+pad);
  const y=mpanel(x,w,h);
  mtext('LEADERBOARD',BW/2,y+Math.round(7*S),10,{align:'center',bold:true});
  const lx=x+Math.round(16*S), rx=x+w-Math.round(16*S);
  let ty=y+head;
  ty=lbSection(lx,rx,ty,S,lh,'DOWNHILL',board.run,
    e=>[e.d+' m'+(e.e==='board'?'   board':''),
        (e.s?'style '+e.s:'')+(e.t?'   '+stamp(e.t):'')]);
  ty+=gapS;
  lbSection(lx,rx,ty,S,lh,'HUNT (as the yeti)',board.hunt,
    e=>[e.n+(e.n===1?' skier':' skiers'),e.t?stamp(e.t):'']);
  mbtn(x+Math.round(20*S),y+h-pad-bh,w-Math.round(40*S),bh,'back','BACK',null,{center:true});
}
function controlScreen(x,w,S){
  const bh=btnH(S,19), pad=Math.round(12*S), rh=btnH(S,16), gp=Math.round(3*S);
  const head=Math.round(23*S), notes=Math.round(24*S);
  const h=fitH(head+ACTIONS.length*(rh+gp)+Math.round(7*S)+rh+notes+bh+pad);
  const y=mpanel(x,w,h);
  mtext('CONTROLS',BW/2,y+Math.round(7*S),10,{align:'center',bold:true});
  const bx=x+Math.round(16*S), bw=w-Math.round(32*S);
  let by=y+head;
  for(const a of ACTIONS){
    mbtn(bx,by,bw,rh,'bind:'+a,ACTION_NAMES[a],
      rebindAction===a?'press a key':keyLabel(binds[a]),{size:7});
    by+=rh+gp;
  }
  by+=Math.round(7*S);
  const half=(bw-Math.round(6*S))/2;
  mbtn(bx,by,half,rh,'preset:arrows','ARROW KEYS',null,{center:true,size:7});
  mbtn(bx+half+Math.round(6*S),by,half,rh,'preset:wasd','WASD',null,{center:true,size:7});
  by+=rh;
  mtext(rebindAction?'press any key to bind it  ·  Esc cancels'
                    :'pick a row to put it on another key',
    BW/2,by+Math.round(5*S),7,{align:'center',bold:!!rebindAction,color:rebindAction?'#c22':'#5b83ae'});
  mtext('fixed:  Esc pause  ·  M music  ·  Q quit (paused)',
    BW/2,by+Math.round(15*S),6,{align:'center',color:'#7a97b8'});
  mbtn(bx,y+h-pad-bh,bw,bh,'back','BACK',null,{center:true});
}
function overScreen(x,w,S){
  const bh=btnH(S,19), pad=Math.round(12*S), head=Math.round(84*S);
  const h=fitH(head+bh+pad);
  const y=mpanel(x,w,h);
  const meters=Math.floor(Math.max(0,P.y/PX_PER_M));
  if(hunting()){
    mtext("TIME'S UP",BW/2,y+Math.round(10*S),13,{align:'center',bold:true,color:'#a22'});
    mtext('skiers eaten: '+eaten+(newBestEaten?'   NEW BEST!':''),BW/2,y+Math.round(32*S),8,
      {align:'center',bold:true,color:newBestEaten?'#1a8a3a':'#112'});
    mtext(eaten===0?'not one. they all got away.'
         :eaten===1?'one. a lean day on the mountain.'
                   :'a good hunt.',BW/2,y+Math.round(44*S),8,{align:'center',color:'#458'});
    mtext('best hunt: '+best.eaten,BW/2,y+Math.round(57*S),8,{align:'center'});
  }else{
    mtext('THE YETI GOT YOU',BW/2,y+Math.round(10*S),13,{align:'center',bold:true,color:'#a22'});
    mtext('distance: '+meters+' m'+(newBestDist?'   NEW BEST!':''),BW/2,y+Math.round(32*S),8,
      {align:'center',color:newBestDist?'#1a8a3a':'#112'});
    mtext('style: '+Math.floor(style)+(newBestStyle?'   NEW BEST!':''),BW/2,y+Math.round(44*S),8,
      {align:'center',color:newBestStyle?'#1a8a3a':'#112'});
    mtext('best: '+Math.floor(best.dist)+' m  ·  style '+Math.floor(best.style),
      BW/2,y+Math.round(57*S),8,{align:'center'});
  }
  if(lbNew) mtext('·  new leaderboard entry  ·',BW/2,y+Math.round(70*S),7,{align:'center',color:'#1a8a3a'});
  const bx=x+Math.round(20*S), bw=(w-Math.round(46*S))/2, by=y+h-pad-bh;
  mbtn(bx,by,bw,bh,'again','PLAY AGAIN',null,{center:true,size:7});
  mbtn(bx+bw+Math.round(6*S),by,bw,bh,'menu','MAIN MENU',null,{center:true,size:7});
}
function menuMove(d){
  if(!uiHits.length) return;
  menuSel=(menuSel+d+uiHits.length)%uiHits.length;
  sndBlip();
}
// k is the raw key, a is the action it is bound to (if any) — so a player on WASD navigates the
// menus with the same keys they steer with, and the arrows keep working regardless.
function menuKey(k,a){
  if(!uiHits.length) return;
  const id=uiHits[menuSel].id;
  if(k==='arrowup'||a==='up')     { menuMove(-1); return; }
  if(k==='arrowdown'||a==='down') { menuMove(1);  return; }
  const lr=(k==='arrowleft'||a==='left')?-1:(k==='arrowright'||a==='right')?1:0;
  if(lr){
    if(id==='chars'){ cycleChar(lr); sndBlip(); }   // the old title-screen shortcut, still here
    else if(menu==='chars'||gamestate==='over') menuMove(lr);
    return;
  }
  if(k===' '||k==='enter'){ menuActivate(id); return; }
  if(gamestate==='over'&&k==='r') startRun();       // muscle memory from the old game-over screen
}
function menuActivate(id){
  initAudio(); sndPick();
  if(id==='play'||id==='again') { startRun(); return; }
  if(id==='menu')               { toMenu(); return; }
  if(id==='music')              { toggleMute(); return; }
  if(id==='back')               { menuSel=BACK_TO[menu]||0; menu='main'; return; }
  if(id==='chars'||id==='scores'||id==='controls'){
    menu=id;
    menuSel=id==='chars'?Math.max(0,CHARS.indexOf(equip)):0;
    return;
  }
  if(id.slice(0,5)==='char:')   { setChar(id.slice(5)); menu='main'; menuSel=1; return; }
  if(id.slice(0,5)==='bind:')   { rebindAction=id.slice(5); return; }
  if(id.slice(0,7)==='preset:') { setPreset(id.slice(7)); return; }
}
function drawPausedText(y){
  ctext('PAUSED', BW/2, y+14, 14, {align:'center',bold:true});
  ctext('Esc — Resume', BW/2, y+42, 8, {align:'center'});
  ctext('M — Music '+(MUS.muted?'off':'on'), BW/2, y+56, 8, {align:'center'});
  ctext('Q — Main Menu', BW/2, y+70, 8, {align:'center'});
}

// ---------- main loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  update(dt); draw(); musicTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// debug handle
window.GAME={get P(){return P},get yeti(){return yeti},get obstacles(){return obstacles},
  get state(){return gamestate},set state(s){gamestate=s},reset,
  get style(){return style},get popups(){return popups},
  get sprites(){return SP},get kits(){return KIT},
  get preys(){return preys},get eaten(){return eaten},get timeLeft(){return timeLeft},
  get equip(){return equip},set equip(v){ setChar(v); },
  get menu(){return menu},set menu(m){ menu=m; menuSel=0; },
  get binds(){return binds},get board(){return board},get hits(){return uiHits}};
</script>
